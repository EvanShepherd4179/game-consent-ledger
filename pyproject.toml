[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-consent-ledger"
version = "0.1.0"
description = "Per-player scope grants and revocations for a game backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
game-consent-api = "game_consent_service.consent_api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/game_consent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
